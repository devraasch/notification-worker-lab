[project]
name = "notification-worker-lab"
version = "0.1.0"
description = "Notification worker lab with FastAPI, Redis and RabbitMQ"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "redis>=5.0.0",
    "pika>=1.3.0",
    "pydantic>=2.0.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
